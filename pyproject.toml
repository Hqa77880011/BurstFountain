[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "burstfountain"
version = "0.1.0"
description = "Burst-aware deadline-risk fountain coding implementation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.scripts]
burstfountain = "burstfountain.cli:main"

[tool.setuptools.packages.find]
include = ["burstfountain*"]
